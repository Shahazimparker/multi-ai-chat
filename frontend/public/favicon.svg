<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#1a0b2e" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#sparkleGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#glowGrad)" opacity="0.25" filter="url(#glow)" />

  <!-- 4-point AI Star / Diamond Sparkle -->
  <path d="M 256 72 
           C 256 170, 276 256, 440 256 
           C 276 256, 256 342, 256 440 
           C 256 342, 236 256, 72 256 
           C 236 256, 256 170, 256 72 Z"
        fill="url(#sparkleGrad)" 
        filter="url(#glow)" />

  <!-- Central Highlight -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
  
  <!-- Mini Orbit Sparkle -->
  <path d="M 370 120 
           C 370 145, 375 160, 410 160 
           C 375 160, 370 175, 370 200 
           C 370 175, 365 160, 330 160 
           C 365 160, 370 145, 370 120 Z"
        fill="#38bdf8" 
        opacity="0.85" />
</svg>
